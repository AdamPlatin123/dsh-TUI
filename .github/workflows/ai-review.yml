# AI 预审（试点 v2：自写 runner，无 App 依赖）：DeepSeek anthropic 端点 + claude CLI。
# key 只经 secrets 引用。产出以 bot 评论发布到 PR。
name: ai-review
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install claude CLI + gh
        run: npm install -g @anthropic-ai/claude-code
      - name: Run AI review
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-v4-flash-vision-exp
          ANTHROPIC_API_KEY: dummy-not-used
        run: |
          claude -p "$(cat <<'PROMPT'
          审查当前仓库工作区的 PR 改动（已检出 PR head）。输出（严格遵守）：
          1. 审核参考：Mergeable / Need Minor Fix / Need Major Fix 三选一
          2. 发现清单：每条 文件:行号 + 问题 + 建议（先列验证过做对的部分；无问题则明说）
          3. 测试记录：你实跑的命令 + 结果（跑不了要说明原因）
          4. 一句话理由
          纪律：文案/目录名类改动对照源码常量核实；不改任何文件；最终输出为纯 markdown 评论稿。
          PROMPT
          )" --output-format text --max-turns 24 > /tmp/review.md 2>/tmp/review.err || {
            echo "::warning::claude 退出码 $?（见 artifact）"; tail -5 /tmp/review.err; exit 1;
          }
          head -c 300 /tmp/review.md
      - name: Post comment
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/review.md
