# AI 预审（试点 v7：小上下文模式）——diff 预打包 + 限轮次，绕开长会话路径
name: ai-review
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.head.sha }}", submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code@2.1.233
      - name: Preseed config + package review material
        run: |
          mkdir -p ~/.claude
          printf '{"hasCompletedOnboarding":true,"theme":"dark"}' > ~/.claude.json
          gh pr diff "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" > "$GITHUB_WORKSPACE/.pr-review.diff" || git diff "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}" > "$GITHUB_WORKSPACE/.pr-review.diff"
          wc -l "$GITHUB_WORKSPACE/.pr-review.diff"
      - name: Run AI review
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-v4-flash-vision-exp
          ANTHROPIC_API_KEY: dummy-not-used
          CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT: '1'
        run: |
          claude -p "审查当前工作区的 .pr-review.diff（本仓库 PR 的权威 diff）。当前目录即 PR head 检出，可自由读取源码核对 diff 涉及文件的上下文（注释/文案改动务必对照源码常量与相关函数实际行为）。输出：1) 审核参考：Mergeable/Need Minor Fix/Need Major Fix 三选一 2) 发现清单（文件:行号+问题+建议，先列做对的部分）3) 一句话理由。不修改任何文件。" --output-format text --max-turns 14 > .pr-review.out 2> .pr-review.err || { echo "exit=$?"; cat .pr-review.err | head -20; exit 1; }
          head -c 200 .pr-review.out
      - name: Post comment
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file .pr-review.out
