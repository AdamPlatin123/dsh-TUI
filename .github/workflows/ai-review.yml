# AI 预审（试点 v7：小上下文模式）——diff 预打包 + 限轮次，绕开长会话路径
name: ai-review
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.head.sha }}", submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code@2.1.233
      - name: Preseed config + package review material
        run: |
          mkdir -p ~/.claude /tmp/material
          printf '{"hasCompletedOnboarding":true,"theme":"dark"}' > ~/.claude.json
          git diff "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}" > /tmp/material/pr.diff
          wc -l /tmp/material/pr.diff
      - name: Run AI review
        working-directory: /tmp/material
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-v4-flash-vision-exp
          ANTHROPIC_API_KEY: dummy-not-used
          CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT: '1'
        run: |
          claude -p "审查 /tmp/material/pr.diff 中的 PR diff（仓库 $GITHUB_REPOSITORY，diff 涉及的文件如需上下文可读仓库 /home/runner/work 下的检出，但优先基于 diff 自身）。输出：1) 审核参考：Mergeable/Need Minor Fix/Need Major Fix 三选一 2) 发现清单（文件:行号+问题+建议，先列做对的部分）3) 一句话理由。不修改任何文件。" --output-format text --max-turns 12 > review.md 2> review.err || { echo "exit=$?"; cat review.err | head -20; exit 1; }
          head -c 200 review.md
      - name: Post comment
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/material/review.md
